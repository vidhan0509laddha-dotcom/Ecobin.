<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECOBIN</title>
<style>
:root{--g:#1b7a43;--g2:#0f5132;--t:#0d9488;--bg:#eef3f1;--c:#fff;--tx:#12261c;--mu:#6b7c74;--bd:#dfe8e3;--nv:#0b1f2a;--bl:#2563eb;--or:#f59e0b;--rd:#dc2626;--pu:#7c3aed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1a22;--c:#12303a;--tx:#e8f3ef;--mu:#8fb0a6;--bd:#1f4652}}
:root[data-theme=dark]{--bg:#0b1a22;--c:#12303a;--tx:#e8f3ef;--mu:#8fb0a6;--bd:#1f4652}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--g2),#08331f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:50;padding:20px}
.splash h1{font-size:44px;margin:8px 0;letter-spacing:2px}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:26px;width:100%;max-width:400px;box-shadow:0 8px 30px #0002}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;color:var(--g)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--c);margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.role{padding:12px 4px;border-radius:12px;border:2px solid transparent;background:#e8f1ec;cursor:pointer;text-align:center;font-size:13px;color:#12261c}
.role.on{color:#fff}.role.on[data-r=staff]{background:var(--g)}.role.on[data-r=collector]{background:var(--bl)}.role.on[data-r=admin]{background:var(--pu)}
.btn{background:var(--g);color:#fff;border:0;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.full{width:100%}.btn.bl{background:var(--bl)}.btn.pu{background:var(--pu)}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}.btn.rd{background:var(--rd)}.btn.sm{padding:6px 10px;font-size:13px}
.app{display:flex;height:100%}
.side{width:230px;background:var(--nv);color:#cfe;display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto;flex-shrink:0}
.side .logo{color:#4ade80;padding:4px 8px 14px}
.nav{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
.nav:hover{background:#ffffff14}.nav.on{background:var(--g);color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--c);border-bottom:1px solid var(--bd)}
.top h2{margin:0;font-size:18px;flex:1}
.ico{position:relative;background:none;border:0;font-size:20px;cursor:pointer}
.bd{position:absolute;top:-4px;right:-6px;background:var(--rd);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px}
.content{flex:1;overflow:auto;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 8px #0000000a}
.card h3{margin:0 0 10px;font-size:15px}
.stat b{font-size:28px;display:block}.stat span{color:var(--mu);font-size:13px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:#e0f2fe;color:#075985}
.b-ok{background:#dcfce7;color:#166534}.b-w{background:#fef3c7;color:#92400e}.b-r{background:#fee2e2;color:#991b1b}.b-i{background:#e0e7ff;color:#3730a3}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
.tw{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{padding:7px 14px;border-radius:20px;background:var(--c);border:1px solid var(--bd);cursor:pointer;font-size:13px}.tab.on{background:var(--g);color:#fff}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.steps{display:flex;gap:2px;margin:10px 0;flex-wrap:wrap}.steps i{flex:1;min-width:30px;height:6px;border-radius:4px;background:var(--bd)}.steps i.d{background:var(--g)}
.map{width:100%;height:320px;background:#dbe8e2;border-radius:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;z-index:60}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:55;padding:16px}.modal .card{max-width:440px;width:100%}
.notif{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.notif.u{font-weight:600}
.tg{width:44px;height:24px;border-radius:12px;background:var(--bd);position:relative;cursor:pointer;flex-shrink:0}.tg i{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}.tg.on{background:var(--g)}.tg.on i{left:22px}
.bnav{display:none}
@media(max-width:800px){.side{display:none}.content{padding:12px;padding-bottom:80px}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--nv);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;z-index:40}
.bnav .nav{flex-direction:column;gap:2px;font-size:10px;padding:6px 10px;color:#cfe;white-space:nowrap}.map{height:260px}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const ls={g(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const LOGO='<svg width="34" height="34" viewBox="0 0 40 40"><path d="M8 14h24l-3 22H11z" fill="#1b7a43"/><path d="M6 12h28v3H6z" fill="#0d9488"/><path d="M20 8c-6 0-9 5-8 10 6 1 10-2 10-7-1 0-2-1-2-3z" fill="#4ade80"/><path d="M18 24h4M20 22v4" stroke="#fff" stroke-width="2"/></svg>';
const USERS={staff:{e:'staff@ecobin.com',p:'staff123',n:'Dr. Priya Sharma',sub:'ICU Ward'},collector:{e:'collector@ecobin.com',p:'collector123',n:'Rahul Kumar',sub:'Collector'},admin:{e:'admin@ecobin.com',p:'admin123',n:'Admin',sub:'System Administrator'}};
const NAV={staff:[['dash','Dashboard','🏠'],['req','Request Collection','➕'],['my','My Requests','📋'],['hist','Waste History','🗂'],['notif','Notifications','🔔'],['prof','Profile','👤'],['set','Settings','⚙️']],
collector:[['dash','Dashboard','🏠'],['tasks','Assigned Tasks','✅'],['robot','Robot','🤖'],['nav','Navigation','🧭'],['hist','History','🗂'],['notif','Notifications','🔔'],['prof','Profile','👤'],['set','Settings','⚙️']],
admin:[['dash','Dashboard','🏠'],['users','Users','👥'],['hosp','Hospitals','🏥'],['coll','Collectors','🚚'],['robots','Robots','🤖'],['track','Live Tracking','📍'],['tasks','Tasks','✅'],['waste','Waste Mgmt','♻️'],['rep','Reports','📄'],['notif','Notifications','🔔'],['set','Settings','⚙️']]};
const LOC={'ICU-2':[110,80],'Ward-3':[300,60],'OT-1':[320,200],'Pharmacy':[90,210],'Emergency':[200,140],'Laboratory':[420,130]};
let robots=[{id:'MR-01',loc:'ICU-2',b:78,s:'Collecting',t:'T-001',dest:'ICU-2',eta:4},{id:'MR-02',loc:'Ward-3',b:45,s:'Charging',t:'—',dest:'—',eta:0},{id:'MR-03',loc:'OT-1',b:62,s:'Idle',t:'—',dest:'—',eta:0},{id:'MR-04',loc:'Pharmacy',b:100,s:'Online',t:'—',dest:'—',eta:0}];
const STAGES=['Requested','Assigned','Robot Dispatched','In Transit','Arrived','Collecting','Collected','Completed'];
let reqs=[{id:'REQ-1024',loc:'ICU-2',type:'Medical Waste',q:4,pr:'High',rb:'MR-01',st:5,at:'10:24 AM'},{id:'REQ-1023',loc:'ICU-2',type:'Sharps',q:2,pr:'Normal',rb:'—',st:0,at:'09:50 AM'},{id:'REQ-1020',loc:'ICU-2',type:'General',q:9,pr:'Low',rb:'MR-03',st:7,at:'Yesterday'}];
let tasks=[{id:'T-001',loc:'ICU-2',type:'Medical Waste',q:4,pr:'High',st:'In Progress',step:1},{id:'T-002',loc:'Ward-3',type:'General Waste',q:6,pr:'Normal',st:'Pending',step:0},{id:'T-003',loc:'OT-1',type:'Sharps',q:2,pr:'High',st:'Pending',step:0}];
const bins=[['BIN-001','ICU-2','Biohazard',91],['BIN-002','Ward-3','General',42],['BIN-003','OT-1','Sharps',84],['BIN-004','Pharmacy','Hazardous',65],['BIN-005','Emergency','Recyclable',30],['BIN-006','Laboratory','Biohazard',95]];
const binSt=p=>p>=90?['Critical','b-r']:p>=80?['Collection Required','b-w']:p>=50?['Monitor','b-i']:['Normal','b-ok'];
let N=[['staff','Collection request accepted','REQ-1024 accepted',1],['staff','Robot dispatched','MR-01 is on the way',1],['staff','Bin requires collection','BIN-003 at 84%',0],['collector','New task assigned','T-003 · OT-1',1],['collector','High-priority task','T-001 · ICU-2',1],['collector','Robot low battery','MR-02 at 45%, charging',0],['admin','New collection request','REQ-1024 from ICU-2',1],['admin','Robot low battery','MR-02 charging',0],['admin','Bin full','BIN-001 Critical (91%)',1],['admin','Critical waste alert','BIN-006 Biohazard 95%',1],['admin','New user','Nurse John added',0],['system','System update','Version 2.0 available',0]].map((a,i)=>({id:i,r:a[0],t:a[1],m:a[2],u:a[3]}));
const USERLIST=[['Dr. Priya Sharma','Hospital Staff','City Hospital','ICU','Active','Today'],['Nurse John','Hospital Staff','City Hospital','Emergency','Active','Yesterday'],['Rahul Kumar','Collector','—','—','Active','Today'],['Admin','Admin','HQ','—','Active','Today'],['Amit Rao','Collector','—','—','Inactive','12 days ago']];
const HIST=[['Today','ICU-2','Biohazard',4,'MR-01','Rahul','Collecting'],['Today','Ward-3','General',6,'MR-02','Rahul','Completed'],['Yesterday','OT-1','Sharps',2,'MR-03','Rahul','Completed'],['Yesterday','Pharmacy','Hazardous',3,'MR-04','Rahul','Completed'],['2 days ago','Emergency','Recyclable',8,'MR-01','Rahul','Completed'],['2 days ago','Laboratory','Biohazard',5,'MR-03','Rahul','Completed']];
const CAT={Biohazard:32,Hazardous:18,Recyclable:21,General:15};
const S={u:null,r:null,p:'dash',tab:{},task:null,rob:'MR-01',theme:ls.g('eb_theme','light'),voice:ls.g('eb_voice','0')==='1',dark:ls.g('eb_theme','light')==='dark',tf:{}};
document.documentElement.dataset.theme=S.theme;
const bc=s=>({Collecting:'b-w',Online:'b-ok',Idle:'b-i',Charging:'b-w',Offline:'b-r'}[s]||'b-i');
const pc=p=>p=='Critical'?'b-r':p=='High'?'b-w':'b-i';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card">'+h+'<div style="margin-top:12px;text-align:right"><button class="btn o sm" onclick="this.closest(\'.modal\').remove()">Close</button></div></div>';document.body.appendChild(m)}
const unread=()=>N.filter(n=>n.u&&(n.r==S.r||n.r=='system')).length;
const accent=()=>S.r=='admin'?'pu':S.r=='collector'?'bl':'';
/* ---------- login ---------- */
let selRole='staff';
function splash(){$('#root').innerHTML='<div class="splash">'+LOGO.replace(/34/g,'90')+'<h1>ECOBIN</h1><div>Smart Medical-Waste Collection &amp; Segregation System</div><p style="margin-top:40px;opacity:.7">Cleaner Hospitals, Greener Tomorrow</p></div>';setTimeout(loginPage,1500)}
function loginPage(){$('#root').innerHTML=`<div class="login"><div class="lbox"><div class="logo">${LOGO}ECOBIN</div><p style="color:var(--mu);font-size:13px;margin:4px 0 16px">Smart Medical-Waste Collection &amp; Segregation System</p>
<label>Employee ID / Email</label><input id="em" placeholder="you@ecobin.com" autocomplete="username">
<label>Password</label><div style="position:relative"><input id="pw" type="password" placeholder="Password"><span onclick="const p=$('#pw');p.type=p.type=='password'?'text':'password'" style="position:absolute;right:10px;top:12px;cursor:pointer">👁</span></div>
<label>Login as:</label><div class="roles">${[['staff','🏥','Hospital Staff'],['collector','🚚','Collector'],['admin','🛡','Admin']].map(r=>`<div class="role ${selRole==r[0]?'on':''}" data-r="${r[0]}" onclick="selRole='${r[0]}';loginPage()">${r[1]}<br>${r[2]}</div>`).join('')}</div>
<div id="err" style="color:var(--rd);font-size:13px;min-height:18px"></div>
<button class="btn full ${selRole=='admin'?'pu':selRole=='collector'?'bl':''}" onclick="doLogin()">Login</button>
<p style="text-align:center;font-size:13px"><a href="#" onclick="event.preventDefault();toast('Password reset link sent (demo)')" style="color:var(--g)">Forgot Password?</a></p>
<p style="font-size:11px;color:var(--mu);text-align:center">Demo: ${USERS[selRole].e} / ${USERS[selRole].p}</p></div></div>`}
function doLogin(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value,u=USERS[selRole];
if(!e||!p)return $('#err').textContent='Enter email and password.';
if(e!=u.e||p!=u.p)return $('#err').textContent='Invalid credentials for the selected role.';
S.u=u;S.r=selRole;S.p='dash';shell()}
/* ---------- shell ---------- */
function shell(){const nav=NAV[S.r];const item=(n,c)=>`<div class="nav ${S.p==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${c?'':n[1]}${n[0]=='notif'&&unread()?`<span class="bd" style="position:static;margin-left:auto">${unread()}</span>`:''}</div>`;
const title=(nav.find(n=>n[0]==S.p)||[0,'Details'])[1];
$('#root').innerHTML=`<div class="app"><aside class="side"><div class="logo">${LOGO}ECOBIN</div>${nav.map(n=>item(n)).join('')}<div class="nav" onclick="logout()" style="margin-top:auto">🚪 Logout</div></aside>
<div class="main"><div class="top"><h2>${title}</h2><button class="ico" title="Voice" onclick="voice()" style="${S.voice?'':'display:none'}">🎤</button><button class="ico" onclick="go('notif')">🔔${unread()?`<span class="bd">${unread()}</span>`:''}</button>
<div style="position:relative"><button class="ico" onclick="$('#pm').style.display=$('#pm').style.display=='block'?'none':'block'">👤</button><div id="pm" class="card" style="display:none;position:absolute;right:0;top:34px;width:180px;z-index:30"><b>${S.u.n}</b><div style="font-size:12px;color:var(--mu);margin-bottom:8px">${S.u.sub}</div>${S.r!='admin'?'<div class="nav on" style="background:none;color:var(--tx)" onclick="go(\'prof\')">Profile</div>':''}<div class="nav" style="color:var(--tx)" onclick="go('set')">Settings</div><div class="nav" style="color:var(--rd)" onclick="logout()">Logout</div></div></div></div>
<div class="content" id="ct"></div></div></div><nav class="bnav">${nav.filter(n=>n[0]!='prof'||S.r=='staff').map(n=>item(n,1).replace('</span>','</span><span>'+n[1].split(' ')[0]+'</span>')).join('')}<div class="nav" onclick="logout()">🚪<span>Logout</span></div></nav>`;
const fn=PAGES[S.p+'_'+S.r]||PAGES[S.p];$('#ct').innerHTML='<div class="card" style="height:90px;opacity:.4">Loading…</div>';setTimeout(()=>{$('#ct').innerHTML=fn()},120)}
function go(p){S.p=p;S.task=null;shell()}
function logout(){S.u=S.r=null;loginPage()}
function tabs(k,arr){const c=S.tab[k]||arr[0];return `<div class="tabs">${arr.map(a=>`<div class="tab ${a==c?'on':''}" onclick="S.tab['${k}']='${a}';shell()">${a}</div>`).join('')}</div>`}
const tb=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||'<tr><td colspan=9>No data yet.</td></tr>'}</table></div>`;
const stat=(v,l,ic)=>`<div class="card stat"><span>${ic||''} ${l}</span><b>${v}</b></div>`;
const bars=(o,unit)=>{const m=Math.max(...Object.values(o));return Object.entries(o).map(([k,v])=>`<div style="margin:8px 0"><div class="row" style="border:0;padding:0"><span>${k}</span><b>${v}${unit||''}</b></div><div class="bar"><i style="width:${v/m*100}%"></i></div></div>`).join('')};
const binCounts={Normal:22,Monitor:12,'Collection Required':9,Critical:5};
const chartCat=`<div class="card"><h3>Waste by Category</h3>${bars(CAT,' kg')}<div class="row"><b>Total</b><b>86 kg</b></div></div>`;
const chartBin=`<div class="card"><h3>Bin Fill Level Status</h3>${bars(binCounts)}</div>`;
function map(sel,h){const rs=robots;return `<svg class="map" viewBox="0 0 520 280" preserveAspectRatio="xMidYMid meet" ${h?'':''}><g stroke="#fff" stroke-width="10" opacity=".9"><path d="M0 100H520M0 170H520M150 0V280M370 0V280M250 0V280"/></g><g fill="#cfe0d8"><rect x="20" y="20" width="100" height="60" rx="6"/><rect x="390" y="20" width="110" height="80" rx="6"/><rect x="170" y="200" width="160" height="60" rx="6"/></g>
<path d="M110 80L110 100L200 100L200 140L320 170L320 200" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 5"/>
${Object.entries(LOC).map(([k,[x,y]])=>`<g><circle cx="${x}" cy="${y}" r="5" fill="#64748b"/><text x="${x+8}" y="${y+4}" font-size="11" fill="#334155">${k}</text></g>`).join('')}
${rs.map(r=>{const [x,y]=LOC[r.loc];const c={Collecting:'#f59e0b',Online:'#16a34a',Idle:'#2563eb',Charging:'#eab308',Offline:'#dc2626'}[r.s];return `<g style="cursor:pointer" onclick="S.rob='${r.id}';${sel?`selRobot('${r.id}')`:`toast('${r.id}: ${r.s}, ${r.b}%')`}"><circle cx="${x-14}" cy="${y-18}" r="13" fill="${c}" stroke="#fff" stroke-width="3"/><text x="${x-14}" y="${y-14}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">${r.id.slice(3)}</text></g>`}).join('')}</svg>`}
function robPanel(id){const r=robots.find(x=>x.id==id)||robots[0];return `<div class="card"><h3>🤖 ${r.id} <span class="badge ${bc(r.s)}">${r.s}</span></h3><div class="row"><span>Battery</span><b>${r.b}%</b></div><div class="bar"><i style="width:${r.b}%;background:${r.b<30?'var(--rd)':'var(--g)'}"></i></div><div class="row"><span>Location</span><b>${r.loc}</b></div><div class="row"><span>Current Task</span><b>${r.t}</b></div><div class="row"><span>Destination</span><b>${r.dest}</b></div><div class="row"><span>ETA</span><b>${r.eta?r.eta+' min':'—'}</b></div>
<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" onclick="toast('Route to ${r.dest} highlighted')">View Route</button>${S.r!='staff'?`<button class="btn sm bl" onclick="toast('Navigation started for ${r.id}')">Start Navigation</button><button class="btn sm o" onclick="toast('Location refreshed')">Refresh</button>`:''}${S.r=='admin'?`<button class="btn sm pu" onclick="assign('${r.id}')">Assign Task</button><button class="btn sm o" onclick="modal('<h3>${r.id} history</h3><p>Last 5 tasks completed. Avg trip 6 min.</p>')">History</button>`:''}</div></div>`}
function selRobot(id){$('#rp').innerHTML=robPanel(id)}
function assign(id){const r=robots.find(x=>x.id==id);const t=tasks.find(t=>t.st=='Pending');if(!t)return toast('No pending tasks');r.s='Collecting';r.t=t.id;r.dest=t.loc;r.eta=5;t.st='In Progress';N.unshift({id:Date.now(),r:'collector',t:'New task assigned',m:t.id+' → '+id,u:1});toast(t.id+' assigned to '+id);shell()}
const trackPage=()=>`<div class="grid g2" style="grid-template-columns:2fr 1fr"><div class="card"><h3>Live Robot Map</h3>${map(1)}</div><div id="rp">${robPanel(S.rob)}</div></div>`;
/* ---------- pages ---------- */
const PAGES={
dash_staff(){const r=reqs[0];return `<h3 style="margin:0">Welcome, ${S.u.n}</h3><p style="color:var(--mu);margin-top:2px">Hospital / Department: ICU Ward</p>
<div class="grid">${stat(reqs.filter(r=>r.st<7).length,'Pending Requests','🟠')}${stat(8,'Collected Today','✅')}${stat(1,'Active Robots','🤖')}</div>
<button class="btn full" style="margin-bottom:14px" onclick="go('req')">+ REQUEST COLLECTION</button>
<div class="grid g2"><div class="card"><h3>Current Request</h3><b>${r.loc}</b> → Robot ${r.rb} → <span class="badge b-w">${STAGES[r.st]}</span><div class="steps">${STAGES.map((s,i)=>`<i class="${i<=r.st?'d':''}" title="${s}"></i>`).join('')}</div><div class="row"><span>Robot location</span><b>${robots[0].loc}</b></div><div class="row"><span>Battery</span><b>${robots[0].b}%</b></div><div class="row"><span>Progress</span><b>${Math.round((r.st+1)/8*100)}%</b></div></div>${chartCat}${chartBin}</div>

function chatDraw(pending){const m=$('#cmsg');if(!m)return;m.innerHTML=CH.msgs.map((x,i)=>`<div class="cm ${x.r=='u'?'cu':'cbt'}">${esc(x.x)}${x.r=='b'?` <span style="cursor:pointer" title="Read aloud" onclick="speak(CH.msgs[${i}].x)">🔊</span>`:''}</div>`).join('')+(pending?'<div class="cm cbt">…</div>':'');m.scrollTop=m.scrollHeight}
/* settings */
PAGES.set=function(){const tg=(k,l,on)=>`<div class="row"><span>${l}</span><div class="tg ${on?'on':''}" onclick="tog('${k}')"><i></i></div></div>`;const dot=(ok,txt)=>`<span style="color:${ok?'var(--g)':'var(--rd)'}">● ${txt}</span>`;
const vs=TTS?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(lang)):[];
return `<div class="grid g2"><div class="card"><h3>${t('set.language')}</h3><select onchange="setLang(this.value)">${LG.map((l,i)=>`<option value="${l}" ${l==lang?'selected':''}>${LN[i]}</option>`).join('')}</select><div class="row"><span>Translation</span>${dot(1,'Active')}</div><h3 style="margin-top:14px">${t('set.dark')}</h3>${tg('dark',t('set.dark'),S.dark)}</div>
<div class="card"><h3>${t('set.voice')}</h3>${tg('voice',t('set.voice'),S.voice)}<div class="row"><span>${t('set.sr')}</span>${dot(!!SRc,SRc?t('set.on'):t('set.off'))}</div><div class="row"><span>${t('set.tts')}</span>${dot(TTS,TTS?t('set.on'):t('set.off'))}</div>${tg('vout',t('set.vout'),ls.g('vout','0')=='1')}<div class="row"><span>${t('set.rate')}</span><input type="range" min="0.6" max="1.4" step="0.1" value="${ls.g('eb_rate','1')}" oninput="ls.s('eb_rate',this.value)" style="width:120px;margin:0"></div>${vs.length?`<select onchange="ls.s('eb_vsel',this.value)">${vs.map(v=>`<option ${v.name==ls.g('eb_vsel','')?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`:(TTS?`<p style="font-size:12px;color:var(--mu)">${t('v.noVoice')}</p>`:'')}${SRc?'':`<p style="font-size:12px;color:var(--mu)">${t('v.unsupported')}</p>`}</div>
<div class="card"><h3>${t('set.ai')}</h3>${tg('eb_ai',t('set.ai'),ls.g('eb_ai','1')=='1')}<div class="row"><span>AI</span>${dot(aiOK,aiOK?'Connected':'Not connected (built-in answers only)')}</div></div></div>`};
if(TTS)speechSynthesis.onvoiceschanged=()=>{if(S.r&&S.p=='set')shell()};
console.info('ECOBIN i18n ready', lang);

splash();
</script></body></html>
